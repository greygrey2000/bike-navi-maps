name: Kartenbild bereitstellen

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/maps.yml', 'publish-map.sh']

permissions:
  contents: write

concurrency:
  group: publish-map
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Karte ausschneiden, prüfen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash publish-map.sh
      - name: Kartenstand festhalten
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Kartenstand $(date -u +%F)"
            git push
          fi
